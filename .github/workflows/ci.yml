name: CI

# Gatekeeper: every push and pull request must pass the full standard
# (code style -> static analysis -> tests) before it is valid for review.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    # Real PostGIS, standing ready. The module has no entities until the roster
    # design rules on the domain model, so today's suite only boots the kernel
    # and never opens a connection — the service is here in the siblings' shape
    # so the first entity needs no CI change.
    services:
      postgres:
        image: ghcr.io/fundistadi/postgis:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: roster_bundle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ROSTER_TEST_DATABASE_URL: "postgresql://app:app@127.0.0.1:5432/roster_bundle_test?serverVersion=17&charset=utf8"

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, iconv, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Code style (php-cs-fixer)
        run: composer cs:check

      - name: Static analysis (PHPStan max)
        run: composer phpstan

      - name: Tests (PHPUnit)
        run: composer test
